name: Sync, Build & Deploy to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - "frontend/src/data/**"
      - "frontend/src/utils/songManifest.ts"
      - "frontend/public/pdfs/**"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "frontend/src/**"
      - "scripts/sheet_sync.py"
      - "requirements.txt"
      - ".github/workflows/content-sync-and-deploy.yml"
  workflow_dispatch:
    inputs:
      song_slug:
        description: "If specified, only syncs this song"
        required: false
        type: string

# If people spam the workflow button it'll enqueue them one at a time
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore sync state from cache
        uses: actions/cache/restore@v3
        with:
          path: .sync_state.json
          key: sync-state-${{ github.ref }}-latest
          restore-keys: |
            sync-state-${{ github.ref }}-
            sync-state-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install minimal Python dependencies for check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync (checks sheet time, content hash, and writes if changed)
        id: sync
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_WORKSHEET_NAME: ${{ secrets.GOOGLE_SHEET_WORKSHEET_NAME }}
          SONG_SLUG: ${{ inputs.song_slug }}
        run: |
          args=(python scripts/sheet_sync.py)
          if [[ -n "$SONG_SLUG" ]]; then
            args+=(--song-slug "$SONG_SLUG")
          fi
          output=$("${args[@]}")
          echo "$output"

          # Extract the changes status from output
          if echo "$output" | grep -q "SYNC_CHANGES_DETECTED=true"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save sync state to cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: .sync_state.json
          key: sync-state-${{ github.ref }}-${{ github.run_id }}

      - name: Commit changes only when files changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage generated song data, manifest, and downloaded PDFs
          git add frontend/src/data || true
          git add frontend/src/utils/songManifest.ts || true
          git add frontend/public/pdfs || true

          # If there are no staged changes, skip committing
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(sync): update song data and PDFs from Google Sheet"
            git push
          fi

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: 20

      - run: npm ci
        if: steps.sync.outputs.changed == 'true'
        working-directory: frontend

      - run: npm run build
        if: steps.sync.outputs.changed == 'true'
        working-directory: frontend

      - uses: peaceiris/actions-gh-pages@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
