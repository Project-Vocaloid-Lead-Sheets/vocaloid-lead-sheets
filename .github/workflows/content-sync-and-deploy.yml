name: Sync, Build & Deploy to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [frontend-mockup]
    paths:
      - "frontend/src/data/**"
      - "frontend/src/utils/songManifest.ts"
      - "frontend/public/pdfs/**"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "frontend/src/**"
      - "frontend/scripts/sheet_sync.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install minimal Python dependencies for check
        run: |
          python -m pip install --upgrade pip
          # Install only the minimal packages needed for the --check-only run
          pip install gspread oauth2client requests python-dotenv

      - name: Check whether sheet changed (lightweight)
        id: check_sheet
        # allow the script to exit non-zero
        continue-on-error: true
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_WORKSHEET_NAME: ${{ secrets.GOOGLE_SHEET_WORKSHEET_NAME }}
        run: |
          # Run the lightweight check-only mode and set an output `changed`
          set +e
          python scripts/sheet_sync.py --check-only
          rc=$?
          if [ "$rc" -eq 0 ]; then
            # 0 means unchanged
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            # non-zero means changed/unknown/error -> treat as 'changed' so we run the full flow
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install full Python dependencies
        if: steps.check_sheet.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch accepted songs
        if: steps.check_sheet.outputs.changed == 'true'
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_WORKSHEET_NAME: ${{ secrets.GOOGLE_SHEET_WORKSHEET_NAME }}
        run: |
          python scripts/sheet_sync.py

      - name: Commit changes only when files changed
        if: steps.check_sheet.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage generated song data, manifest, and downloaded PDFs
          git add frontend/src/data || true
          git add frontend/src/utils/songManifest.ts || true
          git add frontend/public/pdfs || true

          # If there are no staged changes, skip committing
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(sync): update song data and PDFs from Google Sheet"
            git push
          fi

      - uses: actions/setup-node@v4
        if: steps.check_sheet.outputs.changed == 'true'
        with:
          node-version: 20

      - run: npm ci
        if: steps.check_sheet.outputs.changed == 'true'
        working-directory: frontend

      - run: npm run build
        if: steps.check_sheet.outputs.changed == 'true'
        working-directory: frontend

      - uses: peaceiris/actions-gh-pages@v4
        if: steps.check_sheet.outputs.changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
