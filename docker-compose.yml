services:
  discord-bot:
    build:
      context: ./discord-bot

    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"

    volumes:
      - ./discord-bot:/app
      - discord-bot-venv:/app/.venv

    restart: unless-stopped

volumes:
  discord-bot-venv:
