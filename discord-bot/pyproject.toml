[project]
name = "discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Project VocaLead Sheets", email = "projectvocaleadsheets@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
]

[project.scripts]
discord-bot = "discord_bot:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.0",
    "watchfiles>=1.2.0",
]
